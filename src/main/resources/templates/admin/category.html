<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Danh Mục </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/admin.css}" rel="stylesheet" />

</head>

<body class="bg-light">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="flex-grow-1" id="page-content-wrapper">
        <nav class="navbar bg-white shadow-sm sticky-top px-4">
            <h4 class="fw-bold mb-0">Quản lý danh mục</h4>
        </nav>


        <div class="p-4 p-lg-5">

            <div class="card border-0 shadow-sm mb-5">
                <div class="card-body p-5">
                    <h5 class="card-title fw-bold mb-4">Danh mục sản phẩm</h5>

                    <form class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Mã danh mục</label>
                            <input type="text" class="form-control form-control-lg rounded-4" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Tên danh mục</label>
                            <input type="text" class="form-control form-control-lg rounded-4">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold small">Mô tả</label>
                            <textarea class="form-control rounded-4" rows="3"></textarea>
                        </div>
                        <div class="col-12 text-end mt-4">
                            <button type="reset" class="btn btn-outline-danger btn-lg px-4 me-3 btn-action">
                                Hủy
                            </button>

                            <button type="submit" class="btn btn-success btn-lg px-4  btn-action">
                                Thêm mới
                            </button>
                        </div>


                    </form>
                </div>
            </div>
            <div class="card border-0 shadow-sm">
                <div class="card-body p-5">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="card-title fw-bold mb-0">Danh sách danh mục hiện có</h5>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-secondary btn-sm rounded-pill">
                                <i class="fas fa-filter me-1"></i> Lọc
                            </button>
                            <button class="btn btn-outline-secondary btn-sm rounded-pill">
                                <i class="fas fa-download me-1"></i> Xuất
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Tên danh mục</th>
                                    <th>Mô tả</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="fw-bold text-success">Mã</td>
                                    <td class="fw-bold">Tên danh mục</td>
                                    <td class="text-muted">Mô tả</td>
                                    <td><span class="badge bg-success rounded-pill px-3 py-2">Hoạt động</span></td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-primary me-2">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                    </div>

                    <nav aria-label="Phân trang danh mục" class="mt-5">
                        <ul class="pagination pagination-sm justify-content-center">
                            <li class="page-item">
                                <a class="page-link rounded-circle me-2" href="#" aria-label="Trang trước">
                                    <i class="fas fa-chevron-left"></i>
                                </a>
                            </li>
                            <li class="page-item active"><a
                                    class="page-link bg-success border-success text-white rounded-circle mx-1"
                                    href="#">1</a></li>
                            <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">2</a></li>
                            <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">3</a></li>
                            <li class="page-item disabled"><span class="page-link mx-1">...</span></li>
                            <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">12</a></li>
                            <li class="page-item">
                                <a class="page-link rounded-circle ms-2" href="#" aria-label="Trang sau">
                                    <i class="fas fa-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>>
</body>

</html>
