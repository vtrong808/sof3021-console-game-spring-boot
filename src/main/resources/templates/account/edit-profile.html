<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt hồ sơ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="bg-light">

    <div th:replace="layout/header :: header"></div>
    <main class="container-lg px-4 py-5">

        <nav class="mb-4 " aria-label="breadcrumb">
            <ol class="breadcrumb breadcrumb bg-transparent p-0 mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-muted text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item active fw-bold">Cài đặt hồ sơ</li>
            </ol>
        </nav>

        <div class="row g-5">
            <aside class="col-lg-3">
                <div class="card border-0 shadow-sm rounded-4 p-4 ">
                    <div class="text-center mb-4">
                        <div class="avatar-wrapper">
                            <img th:src="${user.avatarUrl != null ? user.avatarUrl : '/images/avatar-default.png'}"
                                class="rounded-circle border border-4 border-white shadow" width="120" height="120" 
                                style="object-fit: cover;">
                        </div>
                        <h5 class="fw-bold mt-3 mb-1" th:text="${user.fullName}">Tên người dùng</h5>
                        <small class="text-muted" th:text="${user.email}">email@example.com</small>
                    </div>

                    <ul class="nav flex-column gap-2">
                        <li>
                            <a class="nav-link active d-flex gap-3 align-items-center rounded-3 px-3 py-2 bg-primary text-white" href="#">
                                <i class="fas fa-user-circle"></i> Cài đặt hồ sơ
                            </a>
                        </li>
                        <li>
                            <a class="nav-link d-flex gap-3 align-items-center rounded-3 px-3 py-2 text-muted" th:href="@{/order/list}">
                                <i class="fas fa-box"></i> Lịch sử đơn hàng
                            </a>
                        </li>
                    </ul>
                    <hr>
                    <a th:href="@{/auth/logout}" class="btn btn-outline-danger w-100 rounded-pill">
                        <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
                    </a>
                </div>
            </aside>

            <section class="col-lg-9">
                <div class="card border-0 shadow-sm rounded-4 mb-5">
                    <div class="card-body p-5">

                        <div class="mb-4">
                            <h2 class="h4 fw-bold mb-1">Thông tin cá nhân</h2>
                            <p class="text-muted mb-0">Quản lý thông tin để bảo mật và sử dụng dịch vụ tốt hơn</p>
                        </div>

                        <div th:if="${param.success}" class="alert alert-success rounded-3 mb-4">
                            <i class="fas fa-check-circle me-2"></i> Cập nhật thông tin thành công!
                        </div>

                        <form th:action="@{/account/update-profile}" method="post" class="row g-4">
                            
                            <div class="col-12">
                                <label class="form-label fw-bold small">Họ và tên</label>
                                <input type="text" name="fullName" class="form-control form-control-lg rounded-4" 
                                       th:value="${user.fullName}" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold small">Email</label>
                                <div class="input-group input-group-lg">
                                    <input type="email" class="form-control rounded-4 bg-light" 
                                           th:value="${user.email}" readonly>
                                    <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-muted"></i></span>
                                </div>
                                <div class="form-text text-muted">Email không thể thay đổi.</div>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold small">Số điện thoại</label>
                                <input type="tel" name="phoneNumber" class="form-control form-control-lg rounded-4" 
                                       th:value="${user.phoneNumber}" placeholder="Thêm số điện thoại">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold small">Địa chỉ giao hàng mặc định</label>
                                <textarea name="address" class="form-control rounded-4" rows="3" 
                                          th:text="${user.address}" placeholder="Nhập địa chỉ của bạn"></textarea>
                            </div>

                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 shadow">
                                    Lưu thay đổi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="layout/footer :: footer"></div>

</body>

</html>
