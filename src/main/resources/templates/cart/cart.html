<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Giỏ Hàng</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="bg-light">

    <div th:replace="layout/header :: header"></div>

    <main class="container-lg py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb bg-transparent p-0">
                <li class="breadcrumb-item"><a th:href="@{/home/index}" class="text-muted text-decoration-none">Trang
                        chủ</a></li>
                <li class="breadcrumb-item active fw-bold">Giỏ hàng</li>
            </ol>
        </nav>

        <div class="row g-5">
            <div class="col-lg-8">
                <h1 class="fw-bold mb-4">Giỏ hàng của bạn</h1>

                <div th:if="${cartItems.isEmpty()}" class="alert alert-info text-center">
                    Giỏ hàng của bạn đang trống. <a th:href="@{/product/list}" class="alert-link">Mua sắm ngay!</a>
                </div>

                <div th:unless="${cartItems.isEmpty()}" class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4 py-4">Sản phẩm</th>
                                    <th class="py-4 d-none d-md-table-cell">Đơn giá</th>
                                    <th class="py-4">Số lượng</th>
                                    <th class="py-4 text-end">Thành tiền</th>
                                    <th class="py-4"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${cartItems}">
                                    <td class="ps-4 py-4">
                                        <div class="d-flex align-items-center gap-4">
                                            <img th:src="@{${item.product.thumbnailUrl}}" class="rounded-3 border"
                                                width="90" alt="Ảnh">
                                            <div>
                                                <h6 class="fw-bold mb-1" th:text="${item.product.productName}">Tên sp
                                                </h6>
                                                <small class="text-muted"
                                                    th:text="${item.product.brand != null ? item.product.brand.brandName : 'Chưa cập nhật'}">
                                                    Brand
                                                </small>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="py-4 d-none d-md-table-cell">
                                        <strong class="text-dark"
                                            th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">Giá</strong>
                                    </td>
                                    <td class="py-4">
                                        <div class="input-group input-group-sm" style="max-width: 120px;">
                                            <a th:href="@{/cart/update/{id}(id=${item.cartItemId}, qty=${item.quantity - 1})}"
                                                class="btn btn-outline-secondary"
                                                th:classappend="${item.quantity <= 1} ? 'disabled' : ''">-</a>

                                            <input type="text" class="form-control text-center bg-white"
                                                th:value="${item.quantity}" readonly>

                                            <a th:href="@{/cart/update/{id}(id=${item.cartItemId}, qty=${item.quantity + 1})}"
                                                class="btn btn-outline-secondary">+</a>
                                        </div>
                                    </td>
                                    <td class="py-4 text-end fw-bold"
                                        th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        Thành tiền
                                    </td>
                                    <td class="py-4 text-center">
                                        <a th:href="@{/cart/remove/{id}(id=${item.cartItemId})}"
                                            class="btn btn-link text-danger p-0"
                                            onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?');">
                                            <i class="fas fa-trash-alt"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4 mt-5">
                    <a th:href="@{/product/list}"
                        class="btn btn-outline-secondary px-4 py-2 d-flex align-items-center gap-2 text-decoration-none">
                        <i class="fas fa-arrow-left"></i> Tiếp tục mua sắm
                    </a>
                </div>
            </div>

            <div class="col-lg-4" th:unless="${cartItems.isEmpty()}">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-5">
                        <h4 class="fw-bold mb-4">Tổng kết</h4>

                        <div class="space-y-3">
                            <div class="d-flex justify-content-between">
                                <span class="text-muted">Tạm tính</span>
                                <span class="fw-bold"
                                    th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0
                                    đ</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-muted">Vận chuyển</span>
                                <span class="text-success fw-bold">Miễn phí</span>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between align-items-end">
                            <strong class="fs-4 fw-bold">Tổng cộng</strong>
                            <h3 class="fw-black mb-0 text-primary"
                                th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h3>
                        </div>

                        <a th:href="@{/order/checkout}"
                            class="btn btn-success btn-lg w-100 mt-5 py-3 fw-bold rounded-pill shadow-lg">
                            <i class="fas fa-credit-card me-2"></i>
                            Thanh toán ngay
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="layout/footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
