<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/admin.css}" rel="stylesheet" />
</head>

<body class="bg-light">
    <div th:replace="layout/sidebar :: sidebar"></div>

    <div class="flex-grow-1" id="page-content-wrapper">

        <nav class="navbar navbar-expand navbar-light bg-white shadow-sm sticky-top px-4">
            <div class="d-flex align-items-center gap-4 w-100">
                <h4 class="fw-bold text-dark mb-0">Quản lý sản phẩm</h4>
            </div>
        </nav>


        <div class="p-4 p-lg-5">

            <div class="card border-0 shadow-sm mb-5">
                <div class="card-body p-5">
                    <h5 class="fw-bold mb-4">Thêm sản phẩm mới</h5>

                    <form class="row g-4">

                        <div class="col-lg-4">
                            <label class="form-label fw-bold small">Ảnh sản phẩm</label>
                            <div
                                class="border border-success border-dashed rounded-4 p-5 text-center bg-light cursor-pointer">
                                <i class="fas fa-cloud-upload-alt text-success fs-1 mb-3"></i>
                                <p class="fw-bold mb-1">Nhấn để tải lên hoặc kéo thả</p>
                                <input type="file" class="d-none" accept="image/*">
                            </div>
                        </div>


                        <div class="col-lg-8">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Tên sản phẩm</label>
                                    <input type="text" class="form-control form-control-lg rounded-4" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Danh mục</label>
                                    <select class="form-select form-select-lg rounded-4">
                                        <option>Console</option>
                                        <option>Handheld</option>
                                        <option>Accessories</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Giá gốc (₫)</label>
                                    <input type="number" class="form-control form-control-lg rounded-4" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Giảm giá (%)</label>
                                    <input type="number" class="form-control form-control-lg rounded-4" placeholder="0">
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-bold small">Tồn kho</label>
                                    <input type="number" class="form-control form-control-lg rounded-4" required>
                                </div>

                                <div class="col-12 text-end">
                                    <button type="reset" class="btn btn-outline-danger btn-lg px-4 me-3">
                                        Hủy
                                    </button>
                                    <button type="submit" class="btn btn-success btn-lg px-4 fw-bold">
                                        Thêm sản phẩm
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">

                        <h5 class="fw-bold mb-0 text-dark">
                            Danh sách sản phẩm
                        </h5>

                        <div class="d-flex align-items-center gap-2">
                            <select class="form-select rounded-pill" style="max-width:200px">
                                <option>Tất cả danh mục</option>
                                <option>Console</option>
                                <option>Handheld</option>
                            </select>

                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Ảnh</th>
                                    <th>Tên</th>
                                    <th>Danh mục</th>
                                    <th>Giá</th>
                                    <th>Tồn kho</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><img src="" class="rounded"></td>
                                    <td class="fw-bold"></td>
                                    <td></td>
                                    <td class="text-success fw-bold"></td>
                                    <td></td>
                                    <td><span class="badge bg-success rounded-pill px-3 py-2"></span></td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-primary me-2"><i
                                                class="fas fa-edit"></i></button>
                                        <button class="btn btn-sm btn-outline-danger"><i
                                                class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <nav aria-label="Phân trang danh mục" class="mt-5">
                        <ul class="pagination pagination-sm justify-content-center">
                            <li class="page-item">
                                <a class="page-link rounded-circle me-2" href="#" aria-label="Trang trước">
                                    <i class="fas fa-chevron-left"></i>
                                </a>
                            </li>
                            <li class="page-item active"><a
                                    class="page-link bg-success border-success text-white rounded-circle mx-1"
                                    href="#">1</a></li>
                            <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">2</a></li>
                            <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">3</a></li>
                            <li class="page-item disabled"><span class="page-link mx-1">...</span></li>
                            <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">12</a></li>
                            <li class="page-item">
                                <a class="page-link rounded-circle ms-2" href="#" aria-label="Trang sau">
                                    <i class="fas fa-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
