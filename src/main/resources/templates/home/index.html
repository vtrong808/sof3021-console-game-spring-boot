<!doctype html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang Chủ</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="bg-light">
  <div th:replace="layout/header :: header"></div>
  <main class="container-lg py-5">
    <section class="py-4">
      <div class="container-fluid px-4">
        <div class="hero-section position-relative overflow-hidden rounded-4 mx-auto">

          <div id="heroCarousel" class="carousel slide carousel-fade h-100" data-bs-ride="carousel"
            data-bs-interval="3000">

            <div class="carousel-indicators">
              <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"></button>
              <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"></button>
              <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"></button>
            </div>

            <div class="carousel-inner">
              <div class="carousel-item active hero-slide" style="background-image: url('/images/ps.jpg');"></div>
              <div class="carousel-item hero-slide" style="background-image: url('/images/nintendo.jpg');"></div>
              <div class="carousel-item hero-slide" style="background-image: url('/images/xbox.jpg');"></div>
            </div>

          </div>

          <div class="hero-overlay position-absolute top-0 start-0 w-100 h-100"></div>

          <div class="hero-content position-absolute top-50 start-0 translate-middle-y w-100">
            <div class="container">
              <div class="row">
                <div class="col-lg-8 col-md-6">
                  <h1 class="display-2 fw-bold lh-1 mb-4 text-white animate__animated animate__fadeInUp">
                    NÂNG TẦM<br>
                    <span class="text-success">TRẢI NGHIỆM GAME</span>
                  </h1>

                  <p class="lead text-white mb-4 ">
                    Ưu đãi độc quyền với console, tay cầm và phụ kiện gaming cao cấp.
                  </p>

                  <button th:href="@{/product/list}"
                    class="btn btn-success btn-lg px-5 py-3 rounded-pill fw-bold shadow-lg animate__animated animate__fadeInUp animate__delay-2s">
                    <a th:href="@{/product/list}" style="color: white">Mua ngay</a>
                    <i class="bi bi-arrow-right ms-2"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <section class="container-xxl px-4 py-5">
      <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="display-6 fw-black">SẢN PHẨM BÁN CHẠY</h2>
        <a th:href="@{/product/list}" class="text-primary fw-bold text-decoration-none d-flex align-items-center gap-1">
          Xem tất cả
          <span class="material-symbols-outlined"></span>
        </a>
      </div>

      <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
        <div class="col" th:each="p : ${products}">
          <div class="card h-100">
            <div class="product-img position-relative">
              <span class="position-absolute top-0 start-0 badge bg-info text-white m-3">
                Hot
              </span>
              <img th:src="@{/images/{img}(img=${p.thumbnailUrl})}" class="card-img-top" alt="Sản phẩm"
                style="height: 200px; object-fit: cover;">
            </div>

            <div class="card-body">
              <h5 class="card-title fw-bold" th:text="${p.productName}">Tên sp</h5>

              <p class="text-muted small mb-3" th:text="${#strings.abbreviate(p.productDescription, 50)}">
                Mô tả
              </p>

              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fs-4 fw-black text-primary"
                  th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">Giá tiền</span>
              </div>

              <a th:href="@{/product/detail/{id}(id=${p.productId})}"
                class="btn btn-outline-secondary w-100 py-3 fw-bold">
                Xem chi tiết
              </a>
            </div>
          </div>
        </div>
      </div>
      <nav th:if="${totalPages > 1}" class="mt-5">
        <ul class="pagination justify-content-center">

          <!-- Previous -->
          <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link" th:href="@{/(page=${currentPage - 1})}">
              &laquo;
            </a>
          </li>

          <!-- Page numbers -->
          <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link" th:href="@{/(page=${i})}" th:text="${i + 1}">
            </a>
          </li>

          <!-- Next -->
          <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
            <a class="page-link" th:href="@{/(page=${currentPage + 1})}">
              &raquo;
            </a>
          </li>

        </ul>
      </nav>

    </section>

    <section class="container-xxl px-4 py-5 bg-light rounded-4 my-5">
      <div class="row mb-5 align-items-center">
        <div class="col-md-8">
          <h2 class="display-6 fw-black mb-2">KHUYẾN MÃI HOT</h2>
          <p class="text-muted">
            Săn deal giá hời ngay hôm nay
          </p>
        </div>
        <div class="col-md-4 text-md-end">
          <a th:href="@{/product/list}" class="btn btn-outline-dark px-4 py-3 fw-bold">
            Xem tất cả
          </a>
        </div>
      </div>
    </section>

  </main>
  <div th:replace="layout/footer :: footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
