<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Thanh Toán</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <style>
        .hover-border-primary:hover {
            border-color: #0d6efd !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #137fec, #0ea5d6);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0ea5d6, #0891b2);
            transform: translateY(-2px);
        }

        .card {
            transition: transform 0.2s;
        }

        /* Custom radio button styling for payment method */
        .form-check-input:checked+.form-check-label {
            color: #0d6efd;
        }

        .form-check-input:checked+.form-check-label .fw-bold {
            color: #0d6efd;
        }
    </style>
</head>

<body class="bg-light">
    <div th:replace="layout/header :: header"></div>

    <main class="container-lg py-5">
        <!-- Breadcrumb từ giao diện 1 -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb bg-transparent p-0 mb-0">
                <li class="breadcrumb-item"><a th:href="@{/cart/view}" class="text-muted text-decoration-none">Giỏ
                        hàng</a></li>
                <li class="breadcrumb-item active fw-bold" aria-current="page">Thanh toán & Giao hàng</li>
            </ol>
        </nav>

        <h1 class="h2 fw-bold mb-2">Thanh toán</h1>
        <p class="text-muted mb-5">Hoàn tất thông tin để nhận hàng nhanh chóng</p>

        <!-- Form bao quanh cả 2 cột để submit dữ liệu -->
        <form th:action="@{/order/preview}" method="post" th:object="${checkoutDTO}">
            <div class="row g-5">

                <!-- CỘT TRÁI: THÔNG TIN GIAO HÀNG & THANH TOÁN -->
                <div class="col-lg-8">

                    <!-- Card 1: Thông tin giao hàng -->
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
                        <div class="card-body p-5">
                            <div class="d-flex align-items-center gap-3 mb-4">
                                <div class="bg-primary bg-opacity-10 p-3 rounded-3">
                                    <i class="fas fa-truck-fast text-primary fs-4"></i>
                                </div>
                                <h3 class="h5 fw-bold mb-0">Thông tin giao hàng</h3>
                            </div>

                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Họ và tên</label>
                                    <input type="text" th:field="*{fullName}"
                                        class="form-control form-control-lg rounded-4"
                                        th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">

                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                        th:errors="*{fullName}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Số điện thoại</label>
                                    <input type="text" th:field="*{phoneNumber}"
                                        class="form-control form-control-lg rounded-4"
                                        th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'">

                                    <div class="invalid-feedback" th:errors="*{phoneNumber}">
                                    </div>

                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small">Địa chỉ nhận hàng</label>
                                    <input type="text" th:field="*{address}"
                                        class="form-control form-control-lg rounded-4"
                                        th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'">

                                    <div class="invalid-feedback" th:errors="*{address}">
                                    </div>
                                </div>
                                <!-- Logic Giao diện 1 không có trường Tỉnh/Thành phố riêng, nên ta dùng Address chung -->

                                <div class="col-12">
                                    <label class="form-label fw-bold small">Ghi chú giao hàng (không bắt buộc)</label>
                                    <textarea th:field="*{note}" class="form-control rounded-4" rows="3"
                                        placeholder="Ví dụ: Gọi trước khi giao, để ở sảnh..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 2: Phương thức thanh toán (Thêm mới để khớp logic Giao diện 1) -->
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
                        <div class="card-body p-5">
                            <div class="d-flex align-items-center gap-3 mb-4">
                                <div class="bg-success bg-opacity-10 p-3 rounded-3">
                                    <i class="fas fa-wallet text-success fs-4"></i>
                                </div>
                                <h3 class="h5 fw-bold mb-0">Phương thức thanh toán</h3>
                            </div>

                            <div class="space-y-3">
                                <!-- COD -->
                                <div
                                    class="form-check p-3 border rounded-3 hover-border-primary cursor-pointer mb-3 bg-white">
                                    <input class="form-check-input mt-2" type="radio" th:field="*{paymentMethod}"
                                        value="COD" id="cod">
                                    <label
                                        class="form-check-label d-flex align-items-center gap-3 ms-2 w-100 cursor-pointer"
                                        for="cod">
                                        <i class="fas fa-money-bill-wave text-success fs-3"></i>
                                        <div>
                                            <span class="fw-bold d-block">Thanh toán khi nhận hàng (COD)</span>
                                            <small class="text-muted">Thanh toán bằng tiền mặt khi shipper giao hàng
                                                đến</small>
                                        </div>
                                    </label>
                                </div>

                                <!-- Banking -->
                                <div
                                    class="form-check p-3 border rounded-3 hover-border-primary cursor-pointer bg-white">
                                    <input class="form-check-input mt-2" type="radio" th:field="*{paymentMethod}"
                                        value="BANK_TRANSFER" id="bank">
                                    <label
                                        class="form-check-label d-flex align-items-center gap-3 ms-2 w-100 cursor-pointer"
                                        for="bank">
                                        <i class="fas fa-university text-primary fs-3"></i>
                                        <div>
                                            <span class="fw-bold d-block">Chuyển khoản ngân hàng</span>
                                            <small class="text-muted">Quét mã QR VietQR để thanh toán nhanh
                                                chóng</small>
                                        </div>
                                    </label>
                                </div>
                            </div>
                            <div class="text-danger small mt-2" th:if="${#fields.hasErrors('paymentMethod')}"
                                th:errors="*{paymentMethod}">
                            </div>

                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a th:href="@{/cart/view}"
                            class="btn btn-outline-secondary px-4 py-2 d-flex align-items-center gap-2 text-decoration-none rounded-pill">
                            <i class="fas fa-arrow-left"></i> Quay lại giỏ hàng
                        </a>
                    </div>
                </div>

                <!-- CỘT PHẢI: TÓM TẮT ĐƠN HÀNG -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-lg rounded-4 sticky-top" style="top: 2rem; z-index: 10;">
                        <div class="card-body p-5">
                            <div class="badge bg-info bg-opacity-10 text-info rounded-pill px-4 py-2 mb-4 fw-bold fs-5">
                                Đơn hàng của bạn
                            </div>

                            <h3 class="h4 fw-bold mb-4">Tóm tắt</h3>

                            <div class="space-y-4 mb-5" style="max-height: 400px; overflow-y: auto;">
                                <!-- Loop Item từ Giao diện 1 -->
                                <div th:each="item : ${cartItems}" class="d-flex gap-4 mb-3 pb-3 border-bottom">
                                    <div class="flex-shrink-0">
                                        <img th:src="@{${item.product.thumbnailUrl}}" class="rounded-3 border"
                                            width="70" height="70" style="object-fit: cover;" alt="Ảnh sp">
                                    </div>
                                    <div class="flex-grow-1">
                                        <h6 class="fw-bold mb-1 text-truncate" style="max-width: 180px;"
                                            th:text="${item.product.productName}">Tên sp</h6>
                                        <div class="d-flex justify-content-between align-items-center">
                                            <small class="text-muted bg-light px-2 py-1 rounded">x<span
                                                    th:text="${item.quantity}">1</span></small>
                                            <p class="text-primary fw-bold mb-0"
                                                th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                                Giá</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Tính toán tiền -->
                            <div class="space-y-3 mb-4">
                                <div class="d-flex justify-content-between">
                                    <span class="text-muted">Tạm tính</span>
                                    <span class="fw-bold"
                                        th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0
                                        đ</span>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <span class="text-muted">Phí vận chuyển</span>
                                    <span class="text-success fw-bold">Miễn phí</span>
                                </div>
                            </div>

                            <hr class="my-4 border-dashed">

                            <div class="d-flex justify-content-between align-items-end mb-4">
                                <div>
                                    <small class="text-muted d-block">Tổng cộng</small>
                                    <h3 class="fw-black mb-0 text-primary"
                                        th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        0 đ</h3>
                                </div>
                            </div>

                            <button type="submit"
                                class="btn btn-success btn-lg w-100 py-3 fw-bold rounded-pill shadow-sm hover-scale">
                                <i class="fas fa-lock me-2"></i> Đặt hàng ngay
                            </button>

                            <div class="text-center mt-4 opacity-75">
                                <i class="fab fa-cc-visa fa-2x me-3 text-muted"></i>
                                <i class="fab fa-cc-mastercard fa-2x me-3 text-muted"></i>
                                <i class="fas fa-university fa-2x text-muted"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <div th:replace="layout/footer :: footer"></div>
</body>

</html>
