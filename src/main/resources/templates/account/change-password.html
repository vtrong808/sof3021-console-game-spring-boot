<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <style>
        .changepassword {
            color: #22c55e;
        }
    </style>
</head>

<body class="bg-light">
    <div th:replace="layout/header :: header"></div>

    <main class="container-lg py-5">

        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-6">

                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-5">
                            <h2 class="changepassword fw-bold mb-2">Đổi mật khẩu</h2>
                            <p class="text-muted mb-0">Cập nhật mật khẩu mới của bạn!</p>
                        </div>

                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                        <form class="row g-4" th:action="@{/account/change-password}" method="post">
                            <div class="col-12">
                                <label class="form-label fw-bold small">Mật khẩu hiện tại</label>
                                <div class="position-relative">
                                    <input type="password" name="currentPassword"
                                        class="form-control form-control-lg rounded-4 pe-5" required>
                                    <i
                                        class="fas fa-lock position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Mật khẩu mới</label>
                                <div class="position-relative">
                                    <input type="password" name="newPassword"
                                        class="form-control form-control-lg rounded-4 pe-5" required minlength="6">
                                    <i
                                        class="fas fa-key position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Xác nhận mật khẩu mới</label>
                                <div class="position-relative">
                                    <input type="password" name="confirmPassword"
                                        class="form-control form-control-lg rounded-4 pe-5" required minlength="6">
                                    <i
                                        class="fas fa-shield-alt position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                                </div>
                            </div>
                            <div class="col-12 d-flex justify-content-between align-items-center pt-4">
                                <a th:href="@{/account/forgot-password}"
                                    class="text-primary text-decoration-none small fw-bold">
                                    <i class="fas fa-question-circle me-1"></i> Quên mật khẩu?
                                </a>
                                <button type="submit"
                                    class="btn btn-primary btn-lg px-5 py-3 rounded-pill fw-bold shadow">
                                    Cập nhật mật khẩu
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a th:href="@{/account/edit-profile}" class="btn btn-outline-secondary px-4 py-2 rounded-pill">
                        <i class="fas fa-arrow-left me-2"></i> Quay lại cài đặt hồ sơ
                    </a>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="layout/footer :: footer"></div>
</body>

</html>
