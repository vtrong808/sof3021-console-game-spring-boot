<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="bg-light">
    <div th:replace="layout/header :: header"></div>
    <main class="container-lg py-5">

        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb bg-transparent p-0 mb-0 fs-5">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-muted text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item active fw-bold text-primary">Sản phẩm</li>
            </ol>
        </nav>
        <div class="container">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-4 mb-5">
                <div>
                    <h1 class="display-5 fw-bold mb-2 text-dark">Tất cả sản phẩm</h1>
                </div>

                <form action="/product/list" method="get" class="d-flex flex-wrap gap-3">
                    <input type="text" name="keyword" class="form-control rounded-pill"
                        placeholder="Tìm kiếm sản phẩm...">
                    <button type="submit" class="btn btn-primary rounded-pill">Tìm</button>
                </form>
            </div>

            <div class="row g-4">
                <aside class="col-lg-3 d-none d-lg-block">
                    <div class="card border-0 shadow-sm rounded-4 mb-4">
                        <div class="card-body">
                            <h5 class="card-title fw-bold text-uppercase small mb-4 tracking-wider text-primary">Danh
                                mục
                            </h5>
                            <ul class="list-group list-group-flush">
                                <li
                                    class="list-group-item d-flex align-items-center gap-3 text-muted hover-bg-light rounded-3">
                                    <i class="fas fa-gamepad fs-5"></i> Tất cả
                                </li>
                                <li
                                    class="list-group-item d-flex align-items-center gap-3 text-muted hover-bg-light rounded-3">
                                    <i class="fas fa-gamepad fs-5"></i> PlayStation
                                </li>
                                <li
                                    class="list-group-item d-flex align-items-center gap-3 text-muted hover-bg-light rounded-3">
                                    <i class="fas fa-gamepad fs-5"></i> Nintendo
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body">
                            <h5 class="card-title fw-bold text-uppercase small mb-4 tracking-wider text-primary">Khoảng
                                giá
                            </h5>
                            <input type="range" class="form-range mb-3 accent-primary" min="0" max="20000000"
                                value="10000000" step="500000">
                            <div class="d-flex justify-content-between small text-muted">
                                <span>0đ</span>
                                <span>20.000.000đ</span>
                            </div>
                            <button class="btn btn-primary w-100 mb-2 mt-3 rounded-pill">Lọc</button>
                        </div>
                    </div>
                </aside>

                <div class="col-lg-9">
                    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
                        <div class="col" th:each="p : ${products}">
                            <div
                                class="card h-100 border-0 shadow-sm product-card rounded-4 overflow-hidden hover-shadow-lg transition-all">
                                <div class="position-relative">
                                    <img th:src="${p.thumbnailUrl}" class="card-img-top" alt="Ảnh sản phẩm"
                                        style="height: 200px; object-fit: cover;">
                                </div>
                                <div class="card-body d-flex flex-column p-4">
                                    <div class="d-flex flex-wrap gap-2 mb-2">
                                        <span class="badge bg-info-subtle text-info" th:if="${p.category != null}"
                                            th:text="${p.category.categoryName}">Category</span>
                                        <span class="badge bg-success-subtle text-success" th:if="${p.brand != null}"
                                            th:text="${p.brand.brandName}">Brand</span>
                                    </div>
                                    <h5 class="card-title fw-bold mb-3 text-dark" th:text="${p.productName}">Tên sp</h5>
                                    <div class="mt-auto">
                                        <p class="fs-4 fw-bold mb-1 text-primary"
                                            th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                            Giá tiền
                                        </p>

                                        <a th:href="@{/product/detail/{id}(id=${p.productId})}"
                                            class="text-decoration-none">
                                            <div class="btn btn-outline-warning w-100 rounded-pill">
                                                <i class="fas fa-eye me-2"></i>
                                                Xem chi tiết
                                            </div>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <nav aria-label="Phân trang" class="mt-5">
                        <ul class="pagination pagination-lg justify-content-center">
                            <li class="page-item disabled">
                                <span class="page-link rounded-circle me-2"><i class="fas fa-chevron-left"></i></span>
                            </li>
                            <li class="page-item active"><a
                                    class="page-link bg-primary border-primary text-white rounded-circle mx-1"
                                    href="#">1</a></li>
                            <li class="page-item disabled">
                                <span class="page-link rounded-circle ms-2"><i class="fas fa-chevron-right"></i></span>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

    </main>
    <div th:replace="layout/footer :: footer"></div>
</body>

</html>
