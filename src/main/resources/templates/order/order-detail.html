<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Chi tiết đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body>
    <div th:replace="layout/header :: header"></div>

    <main class="container-lg py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb bg-transparent p-0 mb-0">
                <li class="breadcrumb-item"><a th:href="@{/order/list}" class="text-muted text-decoration-none">Lịch sử đơn hàng</a></li>
                <li class="breadcrumb-item active fw-bold" aria-current="page">Chi tiết đơn #<span th:text="${order.orderId}"></span></li>
            </ol>
        </nav>

        <div class="row g-5">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-5">
                        <h4 class="fw-bold mb-4">Sản phẩm đã mua</h4>
                        
                        <div class="space-y-4">
                            <div th:each="item : ${order.orderItems}" class="d-flex gap-4 mb-4 pb-4 border-bottom">
                                <div class="flex-shrink-0">
                                    <img th:src="@{${item.product.thumbnailUrl}}" class="rounded-3 border" width="90" height="90" style="object-fit: cover;">
                                </div>
                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between">
                                        <div>
                                            <h6 class="fw-bold mb-1" th:text="${item.product.productName}">Tên sản phẩm</h6>
                                            <small class="text-muted">Đơn giá: <span th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}"></span> đ</small>
                                        </div>
                                        <div class="text-end">
                                            <span class="fw-bold text-primary" 
                                                  th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                                Thành tiền
                                            </span>
                                            <div class="text-muted small mt-1">x<span th:text="${item.quantity}"></span></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="text-muted">Tổng tiền hàng</span>
                            <span class="fw-bold fs-5" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                        </div>
                    </div>
                </div>

                <a th:href="@{/order/list}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="fas fa-arrow-left me-2"></i> Quay lại danh sách
                </a>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">Thông tin nhận hàng</h5>
                        <div class="d-flex align-items-start gap-3 mb-3">
                            <i class="fas fa-map-marker-alt text-primary mt-1"></i>
                            <div>
                                <small class="text-muted d-block">Địa chỉ</small>
                                <span class="fw-semibold" th:text="${order.address}">Địa chỉ người nhận</span>
                            </div>
                        </div>
                        <div class="d-flex align-items-start gap-3 mb-3">
                            <i class="fas fa-phone text-primary mt-1"></i>
                            <div>
                                <small class="text-muted d-block">Điện thoại</small>
                                <span class="fw-semibold" th:text="${order.phoneNumber}">0123456789</span>
                            </div>
                        </div>
                        <div class="d-flex align-items-start gap-3">
                            <i class="fas fa-user text-primary mt-1"></i>
                            <div>
                                <small class="text-muted d-block">Người nhận</small>
                                <span class="fw-semibold" th:text="${order.fullName}">Nguyễn Văn A</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4 bg-light">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">Thanh toán</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Phương thức</span>
                            <span class="fw-bold" th:text="${order.paymentMethod}">COD</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Trạng thái</span>
                            <span class="badge bg-warning text-dark" 
                                  th:classappend="${order.status.name() == 'DELIVERED' ? 'bg-success text-white' : ''}"
                                  th:text="${order.status}">PENDING</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="layout/footer :: footer"></div>
</body>

</html>
