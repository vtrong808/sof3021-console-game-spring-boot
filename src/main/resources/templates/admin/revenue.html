<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân Tích Doanh Thu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/admin.css}" rel="stylesheet" />
</head>

<body class="bg-light">

    <div th:replace="layout/sidebar :: sidebar"></div>

    <div class="flex-grow-1" id="page-content-wrapper">
        <nav class="navbar navbar-expand navbar-light bg-white shadow-sm sticky-top px-4">
            <div class="d-flex align-items-center gap-4 w-100">
                <h4 class="fw-bold text-dark mb-0">Phân tích doanh thu</h4>
            </div>
        </nav>

        <div class="p-4 p-lg-5">
            <div class="row g-4 mb-5">
                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-primary bg-opacity-10 p-3 rounded"><i class="fas fa-dollar-sign text-primary fs-4"></i></div>
                            </div>
                            <p class="text-muted mb-1">Tổng doanh thu</p>
                            <h4 class="fw-bold mb-0 text-success" id="statTotalRevenue">0 ₫</h4>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-info bg-opacity-10 p-3 rounded"><i class="fas fa-boxes-stacked text-info fs-4"></i></div>
                            </div>
                            <p class="text-muted mb-1">Tổng sản phẩm bán</p>
                            <h4 class="fw-bold mb-0" id="statTotalSold">0</h4>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-warning bg-opacity-10 p-3 rounded"><i class="fas fa-shopping-cart text-warning fs-4"></i></div>
                            </div>
                            <p class="text-muted mb-1">Tổng đơn hàng</p>
                            <h4 class="fw-bold mb-0" id="statTotalOrders">0</h4>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-danger bg-opacity-10 p-3 rounded"><i class="fas fa-chart-line text-danger fs-4"></i></div>
                            </div>
                            <p class="text-muted mb-1">Giá trị TB/Đơn</p>
                            <h4 class="fw-bold mb-0" id="statAvgOrder">0 ₫</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-5">
                <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0">Biểu đồ doanh thu năm nay</h5>
                    <select id="yearSelect" class="form-select w-auto rounded-pill" onchange="loadChartData()">
                        <option value="2026" selected>2026</option>
                        <option value="2025">2025</option>
                    </select>
                </div>
                <div class="card-body p-4">
                    <div style="height: 350px;">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4">Hiệu quả theo danh mục</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Danh mục</th>
                                    <th class="text-end">Doanh thu</th>
                                    <th class="text-end">Số lượng bán</th>
                                </tr>
                            </thead>
                            <tbody id="categoryTableBody">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_REVENUE = '/api/admin/revenue';
        let myChart = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadStats();
            loadChartData();
            loadCategoryData();
        });

        // 1. Load Thống kê Cards
        async function loadStats() {
            try {
                const res = await fetch(`${API_REVENUE}/stats`);
                const data = await res.json();
                
                document.getElementById('statTotalRevenue').innerText = formatMoney(data.totalRevenue);
                document.getElementById('statTotalSold').innerText = data.totalSold;
                document.getElementById('statTotalOrders').innerText = data.totalOrders;
                document.getElementById('statAvgOrder').innerText = formatMoney(data.avgOrderValue);
            } catch (err) { console.error(err); }
        }

        // 2. Load Biểu đồ
        async function loadChartData() {
            const year = document.getElementById('yearSelect').value;
            try {
                const res = await fetch(`${API_REVENUE}/chart?year=${year}`);
                const data = await res.json();
                
                // Chuyển đổi dữ liệu API thành mảng cho Chart
                // Tạo mảng 12 tháng mặc định là 0
                const labels = Array.from({length: 12}, (_, i) => `Tháng ${i + 1}`);
                const values = Array(12).fill(0);

                data.forEach(item => {
                    values[item.month - 1] = item.revenue;
                });

                renderChart(labels, values);
            } catch (err) { console.error(err); }
        }

        function renderChart(labels, values) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            
            if (myChart) myChart.destroy(); // Hủy biểu đồ cũ trước khi vẽ mới

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Doanh thu (VNĐ)',
                        data: values,
                        tension: 0.3,
                        backgroundColor: 'rgba(25, 135, 84, 0.1)',
                        borderColor: '#198754',
                        borderWidth: 2,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#198754',
                        pointRadius: 4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString('vi-VN') + ' đ';
                                }
                            }
                        }
                    }
                }
            });
        }

        // 3. Load Danh sách Danh mục
        async function loadCategoryData() {
            try {
                const res = await fetch(`${API_REVENUE}/category`);
                const data = await res.json();
                const tbody = document.getElementById('categoryTableBody');
                tbody.innerHTML = '';

                data.forEach(c => {
                    const row = `
                        <tr>
                            <td class="fw-bold text-primary">${c.categoryName}</td>
                            <td class="text-end fw-bold text-success">${formatMoney(c.revenue)}</td>
                            <td class="text-end">${c.quantity}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) { console.error(err); }
        }

        // Helper
        function formatMoney(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }
    </script>
</body>
</html>
