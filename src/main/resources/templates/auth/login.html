<!DOCTYPE html>
<html lang="vi" xmlns="http:/www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <style>
        .btn-primary {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
            transform: translateY(-2px);
        }



        .rounded-pill {
            border-radius: 50rem !important;
        }

        .shadow-lg {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15) !important;
        }

        .hr {
            border: none;
            height: 1px;
            background-color: #e5e7eb;
        }

        .login {
            color: #22c55e;
        }


        .form-floating .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-57%);
            z-index: 5;
            color: #6b7280;
            font-size: 16px;
            pointer-events: none;
        }

        .form-floating>label {
            padding-left: 3rem;

        }

        .form-floating .form-control {
            padding-left: 2.8rem !important;
            padding-right: 3rem !important;
        }

        .form-floating .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25);
        }


        .form-floating i {
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>

<body>
    <div th:replace="layout/header ::header"></div>
    <main class="min-vh-100 d-flex align-items-center justify-content-center py-5 px-3 bg-light">

        <div class="container">
            <nav class="mb-4 " aria-label="breadcrumb">
                <ol class="breadcrumb breadcrumb bg-transparent p-0 mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-muted text-decoration-none">Trang chủ</a>
                    </li>
                    <li class="breadcrumb-item active fw-bold">Đăng nhập</li>
                </ol>
            </nav>
            <div class="row justify-content-center">
                <div class="col-lg-6 col-xl-5">
                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                        <div class="text-center py-4">
                            <h2 class="login mb-2 mt-3 fw-bold">Đăng nhập</h2>
                            <p class="text-muted mb-0 mt-3">Vui lòng đăng nhập để tiếp tục!</p>
                        </div>

                        <div class="card-body p-3">

                            <form th:action="@{/auth/login}" method="post" class="needs-validation" novalidate>

                                <div th:if="${param.error}" class="alert alert-danger text-center">
                                    Email hoặc mật khẩu không đúng!
                                </div>
                                <div th:if="${param.logout}" class="alert alert-success text-center">
                                    Đã đăng xuất thành công!
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email"
                                        placeholder="name@example.com" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Mật khẩu</label>
                                    <input type="password" class="form-control" id="password" name="password"
                                        placeholder="Nhập mật khẩu" required>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="remember">
                                        <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
                                    </div>
                                    <a th:href="@{/account/forgot-password}"
                                        class="text-decoration-none text-primary">Quên mật khẩu?</a>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Đăng nhập</button>
                            </form>


                            <div class="d-flex align-items-center my-4">
                                <hr class="flex-grow-1">
                                <span class="px-3 text-muted small">Hoặc đăng nhập với</span>
                                <hr class="flex-grow-1">
                            </div>

                            <div class="d-flex justify-content-center gap-3">
                                <a class="btn btn-light rounded-circle p-3"><i
                                        class="fab fa-google text-danger"></i></a>
                                <a class="btn btn-light rounded-circle p-3"><i class="fab fa-facebook-f "
                                        style="color: #0a4ec8;"></i></a>
                            </div>


                            <div class="text-center mt-5">
                                <p class="text-muted">
                                    Chưa có tài khoản?
                                    <a th:href="@{/account/sign-up}"
                                        class="text-primary fw-bold text-decoration-none">Tạo tài khoản
                                        ngay</a>
                                </p>
                            </div>

                        </div>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <div th:replace="layout/footer ::footer"></div>
</body>

</html>
