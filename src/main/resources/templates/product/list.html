<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="bg-light">
    <div th:replace="layout/header :: header"></div>

    <main class="container-lg px-4 px-lg-5 py-5">

        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb bg-transparent p-0 mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-muted text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item active fw-bold text-primary">Sản phẩm</li>
            </ol>
        </nav>
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-4 mb-5">
            <div>
                <h1 class="display-5 fw-bold mb-2 text-dark">Tất cả sản phẩm</h1>
            </div>
            <div class="d-flex flex-wrap gap-3">
                <select class="form-select w-auto rounded-pill border-primary focus:border-primary">
                    <option>Sắp xếp: Nổi bật</option>
                    <option>Giá: Thấp → Cao</option>
                    <option>Giá: Cao → Thấp</option>
                    <option>Mới nhất</option>
                </select>
                <button class="btn btn-outline-primary d-lg-none rounded-pill">
                    <i class="fas fa-filter me-1"></i> Lọc
                </button>
            </div>
        </div>

        <div class="row g-4">
            <aside class="col-lg-3 d-none d-lg-block">
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-uppercase small mb-4 tracking-wider text-primary">Danh mục
                        </h5>
                        <ul class="list-group list-group-flush">
                            <li
                                class="list-group-item active bg-dark text-white border-0 d-flex align-items-center gap-3 rounded-3">
                                <i class="fas fa-gamepad fs-5"></i> PlayStation
                            </li>
                            <li
                                class="list-group-item d-flex align-items-center gap-3 text-muted hover-bg-light rounded-3">
                                <i class="fas fa-gamepad fs-5"></i> Xbox
                            </li>
                            <li
                                class="list-group-item d-flex align-items-center gap-3 text-muted hover-bg-light rounded-3">
                                <i class="fas fa-gamepad fs-5"></i> Nintendo
                            </li>
                            <li
                                class="list-group-item d-flex align-items-center gap-3 text-muted hover-bg-light rounded-3">
                                <i class="fas fa-headset fs-5"></i> Khác
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-uppercase small mb-4 tracking-wider text-primary">Khoảng giá
                        </h5>
                        <input type="range" class="form-range mb-3 accent-primary" min="0" max="20000000"
                            value="10000000" step="500000">
                        <div class="d-flex justify-content-between small text-muted">
                            <span>0đ</span>
                            <span>20.000.000đ</span>
                        </div>

                        <hr class="my-4 border-primary border-opacity-25">

                        <h6 class="fw-bold small text-uppercase mb-3 text-primary">Tình trạng hàng</h6>
                        <div class="form-check mb-2">
                            <input class="form-check-input accent-primary" type="checkbox" id="conHang" checked>
                            <label class="form-check-label" for="conHang">Còn hàng</label>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input accent-primary" type="checkbox" id="giamGia">
                            <label class="form-check-label" for="giamGia">Đang giảm giá</label>
                        </div>

                        <button class="btn btn-primary w-100 mb-2 rounded-pill">Lọc</button>
                        <button class="btn btn-link w-100 text-primary small text-decoration-none">Xóa bộ lọc</button>
                    </div>
                </div>
            </aside>
            <div class="col-lg-9">
                <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
                    <div class="col">
                        <div
                            class="card h-100 border-0 shadow-sm product-card rounded-4 overflow-hidden hover-shadow-lg transition-all">
                            <div class="position-relative">
                                <img class="card-img-top" alt="Ảnh sản phẩm">
                            </div>
                            <div class="card-body d-flex flex-column p-4">
                                <div class="d-flex flex-wrap gap-2 mb-2">
                                    <span class="badge bg-info-subtle text-info">Tên sp</span>
                                    <span class="badge bg-success-subtle text-success">Phiên bản </span>
                                </div>
                                <h5 class="card-title fw-bold mb-3 text-dark">Tên sp</h5>
                                <div class="mt-auto">
                                    <p class="fs-4 fw-bold mb-1 text-primary">
                                        Giá giảm
                                        <small class="text-muted text-decoration-line-through ms-2">Giá gốc</small>
                                    </p>
                                    <a>
                                        <div class="btn btn-outline-warning w-100 rounded-pill">
                                            <i class="fas fa-eye me-2"></i>
                                            Xem chi tiết
                                        </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <nav aria-label="Phân trang" class="mt-5">
                    <ul class="pagination pagination-lg justify-content-center">
                        <li class="page-item">
                            <a class="page-link rounded-circle me-2" href="#" aria-label="Trang trước">
                                <i class="fas fa-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item active"><a
                                class="page-link bg-primary border-primary text-white rounded-circle mx-1"
                                href="#">1</a></li>
                        <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">2</a></li>
                        <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">3</a></li>
                        <li class="page-item disabled"><span class="page-link mx-1">...</span></li>
                        <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">12</a></li>
                        <li class="page-item">
                            <a class="page-link rounded-circle ms-2" href="#" aria-label="Trang sau">
                                <i class="fas fa-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
    <div th:replace="layout/footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
