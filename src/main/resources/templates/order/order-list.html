<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Danh Sách Đơn Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body>
    <div th:replace="layout/header :: header"></div>
    <main class="container-xxl px-4 px-lg-5 py-5 bg-light">

        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb bg-transparent p-0 mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-muted text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item"><a href="#" class="text-muted text-decoration-none">Tài khoản</a></li>
                <li class="breadcrumb-item active fw-bold" aria-current="page">Danh sách đơn hàng</li>
            </ol>
        </nav>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4 mb-5">
            <div>
                <h1 class="h2 fw-bold mb-2">Danh sách đơn hàng</h1>
                <p class="text-muted">Quản lý và theo dõi các đơn hàng máy chơi game & phụ kiện của bạn</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 mb-5">
            <div class="card-body p-4">
                <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center">

                    <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-primary btn-sm rounded-pill px-4 fw-bold">Tất cả đơn hàng</button>
                        <button class="btn btn-outline-secondary btn-sm rounded-pill px-4">Đang xử lý</button>
                        <button class="btn btn-outline-secondary btn-sm rounded-pill px-4">Đã giao</button>
                        <button class="btn btn-outline-secondary btn-sm rounded-pill px-4">Hoàn thành</button>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <small class="text-muted">Sắp xếp theo:</small>
                        <select class="form-select form-select-sm w-auto rounded-pill">
                            <option>Mới nhất trước</option>
                            <option>Cũ nhất trước</option>
                            <option>Giá cao → thấp</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>


        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="py-4 px-5 small fw-bold text-uppercase text-muted">Mã đơn</th>
                            <th class="py-4 px-5 small fw-bold text-uppercase text-muted">Ngày đặt</th>
                            <th class="py-4 px-5 small fw-bold text-uppercase text-muted">Tổng tiền</th>
                            <th class="py-4 px-5 small fw-bold text-uppercase text-muted">Trạng thái</th>
                            <th class="py-4 px-5 text-end"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="hover-bg-light">
                            <td class="py-4 px-5 fw-bold text-primary"></td>
                            <td class="py-4 px-5 text-muted"></td>
                            <td class="py-4 px-5 fw-bold"></td>
                            <td class="py-4 px-5">
                                <span class="badge bg-warning text-dark"></span>
                            </td>
                            <td class="py-4 px-5 text-end">
                                <a th:href="@{/order/detail}" class="btn btn-sm btn-outline-success">Chi tiết</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>


            <div class="card-footer bg-light d-flex justify-content-between align-items-center py-4 px-5">
                <small class="text-muted">Hiển thị trang </small>
                <nav aria-label="Phân trang">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item disabled">
                            <a class="page-link" href="#"><i class="fas fa-chevron-left"></i></a>
                        </li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#"><i class="fas fa-chevron-right"></i></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
    <div th:replace="layout/footer :: footer"></div>
</body>

</html>
