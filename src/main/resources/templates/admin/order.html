<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/admin.css}" rel="stylesheet" />
</head>

<body class="bg-light">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="flex-grow-1" id="page-content-wrapper">

        <nav class="navbar navbar-expand navbar-light bg-white shadow-sm sticky-top px-4">
            <div class="d-flex align-items-center gap-4 w-100">
                <h4 class="fw-bold text-dark mb-0">Quản lý đơn hàng</h4>
            </div>
        </nav>

        <div class="p-4 p-lg-5">
            <div class="d-flex align-items-center gap-3 ms-4 ">
                <button class="btn btn-success rounded-pill px-4 py-2 d-flex align-items-center gap-2 mb-3 ms-auto">
                    <i class="fas fa-plus"></i>
                    Tạo đơn hàng mới
                </button>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-primary bg-opacity-10 p-3 rounded">
                                    <i class="fas fa-dollar-sign text-primary fs-4"></i>
                                </div>
                                <span class="badge bg-success">+0%</span>
                            </div>
                            <p class="text-muted mb-1">Tổng doanh thu</p>
                            <h4 class="fw-bold mb-0">0</h4>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-warning bg-opacity-10 p-3 rounded">
                                    <i class="fas fa-clock text-warning fs-4"></i>
                                </div>
                                <span class="badge bg-warning text-dark">Cần xử lý</span>
                            </div>
                            <p class="text-muted mb-1">Đơn chờ xử lý</p>
                            <h4 class="fw-bold mb-0">0</h4>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-info bg-opacity-10 p-3 rounded">
                                    <i class="fas fa-truck text-info fs-4"></i>
                                </div>
                                <span class="badge bg-info">+0%</span>
                            </div>
                            <p class="text-muted mb-1">Đơn đang giao</p>
                            <h4 class="fw-bold mb-0">0</h4>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-danger bg-opacity-10 p-3 rounded">
                                    <i class="fas fa-ban text-danger fs-4"></i>
                                </div>
                                <span class="badge bg-danger">0%</span>
                            </div>
                            <p class="text-muted mb-1">Tỷ lệ hủy đơn</p>
                            <h4 class="fw-bold mb-0">0%</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-5">
                <div class="card-body p-4">
                    <div class="d-flex flex-wrap gap-3 mb-4">
                        <button class="btn btn-success rounded-pill px-4 py-2 fw-bold">Tất cả đơn hàng</button>
                        <button class="btn btn-outline-secondary rounded-pill px-4 py-2">Chờ xử lý</button>
                        <button class="btn btn-outline-secondary rounded-pill px-4 py-2">Đang giao</button>
                        <button class="btn btn-outline-secondary rounded-pill px-4 py-2">Hoàn thành</button>
                        <button class="btn btn-outline-secondary rounded-pill px-4 py-2">Đã hủy</button>
                    </div>

                    <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center">
                        <div class="text-muted small">
                            Hiển thị 1-50
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-secondary btn-sm rounded-pill">
                                <i class="fas fa-filter me-1"></i> Lọc theo ngày
                            </button>
                            <button class="btn btn-outline-success btn-sm rounded-pill">
                                <i class="fas fa-download me-1"></i> Xuất Excel
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bảng đơn hàng -->
            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Mã đơn</th>
                                <th>Khách hàng</th>
                                <th>Ngày đặt</th>
                                <th>Thành tiền</th>
                                <th>Trạng thái</th>
                                <th class="text-end">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="fw-bold text-success"></td>
                                <td>
                                    <div class="d-flex flex-column">
                                        <strong></strong>
                                        <small class="text-muted"></small>
                                    </div>
                                </td>
                                <td></td>
                                <td class="fw-bold text-success"></td>
                                <td><span class="badge bg-warning text-dark rounded-pill px-3 py-2"></span>
                                </td>
                                <td class="text-end">
                                    <select class="form-select form-select-sm w-auto d-inline-block rounded-pill">
                                        <option selected>Chờ xử lý</option>
                                        <option>Đang giao</option>
                                        <option>Hoàn thành</option>
                                        <option>Hủy</option>
                                    </select>
                                    <button class="btn btn-sm btn-outline-primary ms-2">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>
                <nav aria-label="Phân trang danh mục" class="mt-5">
                    <ul class="pagination pagination-sm justify-content-center">
                        <li class="page-item">
                            <a class="page-link rounded-circle me-2" href="#" aria-label="Trang trước">
                                <i class="fas fa-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item active"><a
                                class="page-link bg-success border-success text-white rounded-circle mx-1"
                                href="#">1</a></li>
                        <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">2</a></li>
                        <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">3</a></li>
                        <li class="page-item disabled"><span class="page-link mx-1">...</span></li>
                        <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">12</a></li>
                        <li class="page-item">
                            <a class="page-link rounded-circle ms-2" href="#" aria-label="Trang sau">
                                <i class="fas fa-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
