<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt hồ sơ</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <style>
        .avatar-wrapper {
            position: relative;
            display: inline-block;
        }

        .change-avatar {
            opacity: 0;
            transition: .2s;
        }

        .avatar-wrapper:hover .change-avatar {
            opacity: 1;
        }

        .hover-bg-light:hover {
            background-color: #f8f9fa !important;
        }

        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-2px);
        }

        .card:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1) !important;
        }
    </style>
</head>

<body class="bg-light">

    <div th:replace="layout/header :: header"></div>
    <main class="container-lg py-5">

        <nav class="mb-4" aria-label="breadcrumb">
            <ol class="breadcrumb breadcrumb bg-transparent p-0 mb-0 fs-5">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-muted text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item active fw-bold text-primary">Cài đặt hồ sơ</li>
            </ol>
        </nav>

        <div class="row g-5">

            <aside class="col-lg-3">
                <div class="card border-0 shadow-sm rounded-4 p-4 ">

                    <div class="text-center mb-4">
                        <div class="avatar-wrapper">
                            <img src="/images/avatar-default.png"
                                class="rounded-circle border border-4 border-white shadow" width="120" height="120">

                            <button
                                class="btn btn-primary btn-sm rounded-circle position-absolute bottom-0 end-0 p-2 change-avatar">
                                <i class="fas fa-camera"></i>
                            </button>
                        </div>

                        <h5 class="fw-bold mt-3 mb-1">Họ và tên</h5>
                        <small class="text-muted">Địa chỉ</small>
                    </div>

                    <ul class="nav flex-column gap-2">
                        <li>
                            <a class="nav-link active d-flex gap-3 align-items-center rounded-3 px-3 py-2" href="#">
                                <i class="fas fa-user-circle"></i> Cài đặt hồ sơ
                            </a>
                        </li>
                        <li>
                            <a class="nav-link d-flex gap-3 align-items-center rounded-3 px-3 py-2 text-muted" href="#">
                                <i class="fas fa-box"></i> Lịch sử đơn hàng
                            </a>
                        </li>
                        <li>
                            <a class="nav-link d-flex gap-3 align-items-center rounded-3 px-3 py-2 text-muted" href="#">
                                <i class="fas fa-heart"></i> Yêu thích
                            </a>
                        </li>
                    </ul>

                    <hr>

                    <a class="btn btn-outline-danger w-100 rounded-pill">
                        <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
                    </a>
                    <a th:href="@{/account/change-password}" class="btn btn-outline-info w-100 rounded-pill mt-4">
                        <i class="fas fa-key me-2"></i> Đổi mật khẩu

                    </a>
                </div>
            </aside>
            <section class="col-lg-9">
                <div class="card border-0 shadow-sm rounded-4 mb-5">
                    <div class="card-body p-5">

                        <div class="mb-4">
                            <h2 class="h4 fw-bold mb-1">Thông tin cá nhân</h2>
                            <p class="text-muted mb-0">Quản lý thông tin để bảo mật và sử dụng dịch vụ tốt hơn</p>
                        </div>

                        <form class="row g-4">

                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Họ</label>
                                <input class="form-control form-control-lg rounded-4" placeholder="Họ">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Tên</label>
                                <input class="form-control form-control-lg rounded-4" placeholder="Tên">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold small">Email</label>
                                <div class="input-group input-group-lg">
                                    <input class="form-control rounded-4" placeholder="Email" readonly>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold small">Số điện thoại</label>
                                <input class="form-control form-control-lg rounded-4" placeholder="Số điện thoại    ">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold small">Địa chỉ giao hàng</label>
                                <textarea class="form-control rounded-4" rows="3"></textarea>
                            </div>

                            <div class="col-12 text-end">
                                <button class="btn btn-primary btn-lg rounded-pill px-5 shadow">
                                    Lưu thay đổi
                                </button>
                            </div>
                        </form>
                    </div>
            </section>
        </div>
    </main>

    <div th:replace="layout/footer :: footer"></div>

</body>

</html>
