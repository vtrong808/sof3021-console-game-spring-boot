<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link th:href="@{/css/style.css}" rel="stylesheet" />

  <style>
    .cart-badge {
      position: absolute;
      top: -6px;
      right: -8px;
      background: #dc3545;
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      line-height: 1;
    }
  </style>
</head>

<body>
  <nav th:fragment="header" class="navbar navbar-expand-md navbar-light bg-white shadow-sm sticky-top">
    <div class="container-xl px-4">

      <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-dark" th:href="@{/}">
        <img th:src="@{/images/panda2.png}" alt="Logo" height="55" class="me-3">
      </a>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto gap-4">
          <li class="nav-item">
            <a class="nav-link fw-semibold" th:href="@{/}">Trang chủ</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" th:href="@{/product/list}">Sản phẩm</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" th:href="@{/cart/view}">Giỏ hàng</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" th:href="@{/order/list}">Đơn hàng</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3 ms-auto">

          <!-- Search -->
          <form action="/product/list" method="get" class="position-relative">
            <i
              class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            <input name="keyword" type="search" class="form-control ps-5 rounded-5" placeholder="Tìm kiếm ...">
          </form>

          <!-- Cart -->
          <a th:href="@{/cart/view}" class="mini-cart-btn text-decoration-none">
            <span class="position-relative">
              <i class="fas fa-shopping-cart fs-5"></i>
              <span class="cart-badge" th:text="${cartItemCount}"
                th:classappend="${cartItemCount == 0} ? 'd-none'"></span>
            </span>
          </a>

          <!-- User (đã đăng nhập) -->
          <div class="dropdown">
            <a class="dropdown-toggle text-decoration-none" href="#" data-bs-toggle="dropdown">
              <img th:src="@{/images/avatar.png}" class="rounded-circle" width="40" height="40">
            </a>

            <ul class="dropdown-menu dropdown-menu-end shadow rounded-3">

              <!-- admin -->
              <li sec:authorize="hasAnyRole('ADMIN','STAFF')">
                <a class="dropdown-item text-black fw-semibold" th:href="@{/admin/dashboard}">
                  <i class="fas fa-gauge me-2"></i> Admin Dashboard
                </a>
              </li>

              <li>
                <a class="dropdown-item" th:href="@{/account/edit-profile}">
                  <i class="fas fa-user me-2"></i> Hồ sơ
                </a>
              </li>

              <li>
                <hr class="dropdown-divider">
              </li>

              <li>
                <a class="dropdown-item text-danger" th:href="@{/auth/logout}">
                  <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
                </a>
              </li>
            </ul>
          </div>

        </div>
      </div>
    </div>
  </nav>
</body>

</html>
