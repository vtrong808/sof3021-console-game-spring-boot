<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


  <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body>
  <nav th:fragment="header" class="navbar navbar-expand-md navbar-light bg-white shadow-sm sticky-top">
    <div class="container-xl px-4 position-relative">

      <div class="collapse navbar-collapse" id="navbarContent">

        <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-dark" th:href="@{/}">
          <img th:src="@{/images/panda2.png}" alt="Logo" height="55" class="me-3">
        </a>

        <ul class="navbar-nav me-auto gap-4">
          <li class="nav-item">
            <a class="nav-link fw-semibold " th:href="@{/}">Trang chủ</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold " th:href="@{/product/list}" role="button">
              Sản phẩm
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link fw-semibold" th:href="@{/cart/view}">Giỏ hàng</a>
          </li>

          <li class="nav-item">
            <a class="nav-link fw-semibold" th:href="@{/order/list}">Đơn hàng</a>
          </li>
        </ul>


        <div class="d-flex align-items-center gap-3 ms-auto">

          <form class="position-relative">
            <i
              class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            <input type="search" class="form-control ps-5 rounded-5" placeholder="Tìm kiếm ...">
          </form>
          <a th:href="@{/cart/view}" class="mini-cart-btn d-flex align-items-center gap-2 text-decoration-none"
            aria-label="giỏ hàng">

            <span class="icon-wrap position-relative">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart"
                viewBox="0 0 16 16">
                <path
                  d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2" />
              </svg>
              <span class="cart-badge">0</span>
            </span>
          </a>

          <a th:href="@{/auth/login}"
            class="user-login rounded-circle d-flex align-items-center justify-content-center">

            <span class="icon-wrap position-relative">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                class="bi bi-person-circle" viewBox="0 0 16 16">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
                <path fill-rule="evenodd"
                  d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
              </svg>
            </span>
          </a>

          <div class="dropdown">
            <a class="dropdown-toggle text-decoration-none" href="#" data-bs-toggle="dropdown">
              <img th:src="@{/images/avatar.png}" class="rounded-circle" width="40" height="40">
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow">
              <li><a class="dropdown-item" th:href="@{/account/edit-profile}">Hồ sơ</a></li>
              <li><a class="dropdown-item" th:href="@{/auth/logout}">Đăng xuất</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    </div>
  </nav>

</body>

</html>
