<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Chi tiết sản phẩm</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body>
  <div th:replace="layout/header :: header"></div>
  <main class="container-lg py-5">
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb bg-transparent p-0">
        <li class="breadcrumb-item"><a th:href="@{/home/index}" class="text-muted text-decoration-none">Trang
            chủ</a></li>
        <li class="breadcrumb-item active fw-bold">Chi tiết sản phẩm</li>
      </ol>
    </nav>
    <div class="row g-5 align-items-start">
      <div class="col-lg-6">
        <div class="card border-0 shadow rounded-4 overflow-hidden mb-4">
          <img th:src="@{${p.thumbnailUrl}}" class="img-fluid product-image w-100" alt="Ảnh sản phẩm">
        </div>

        <div class="row g-3 thumb">
          <div class="col-3">
            <img th:src="@{${p.thumbnailUrl}}" class="img-fluid rounded-3 border border-primary" alt="Thumb">
          </div>
          <div class="col-3">
            <img th:src="@{${p.thumbnailUrl}}" class="img-fluid rounded-3 opacity-75" alt="Thumb">
          </div>
        </div>
      </div>

      <div class="col-lg-6">

        <span class="badge bg-warning text-dark mb-3 px-3 py-2" th:if="${p.brand != null}"
          th:text="${p.brand.brandName}">Thương hiệu</span>

        <h1 class="fw-bold mb-3" th:text="${p.productName}">Tên sản phẩm</h1>

        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="text-warning fs-5">
            <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i
              class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
          </div>
          <span class="text-muted">(Đánh giá: 4.5/5)</span>
        </div>

        <div class="p-4 bg-white rounded-4 shadow-sm mb-4">
          <div class="d-flex align-items-end gap-3">
            <span class="display-6 fw-bold text-primary"
              th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">Giá</span>
          </div>
          <span class="badge bg-success mt-3" th:if="${p.stockQuantity > 0}">
            <i class="fas fa-check me-1"></i> Còn hàng
          </span>
          <span class="badge bg-danger mt-3" th:if="${p.stockQuantity == 0}">
            <i class="fas fa-times me-1"></i> Hết hàng
          </span>
        </div>

        <p class="text-secondary mb-4" th:text="${p.productDescription}">
          Nội dung chi tiết
        </p>

        <div class="mb-4">
          <h6 class="fw-bold mb-3">Tùy chọn</h6>
          <div class="btn-group w-auto">
            <button class="btn btn-outline-primary active">Tiêu chuẩn</button>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-4">
            <div class="input-group">
              <button class="btn btn-outline-secondary">-</button>
              <input type="number" class="form-control text-center" value="1" min="1">
              <button class="btn btn-outline-secondary">+</button>
            </div>
          </div>
          <div class="col">
            <a th:href="@{/cart/add/{id}(id=${p.productId})}"
              class="btn btn-primary w-100 h-100 fs-5 d-flex align-items-center justify-content-center text-decoration-none">
              <i class="fas fa-cart-plus me-2"></i> Thêm vào giỏ
            </a>
          </div>
        </div>

        <button class="btn btn-outline-secondary w-25 mb-4">
          <i class="fas fa-heart me-2"></i> Yêu thích
        </button>


        <div class="row g-3">
          <div class="col-md-6">
            <div class="p-3 bg-white rounded-3 shadow-sm d-flex gap-3">
              <i class="fas fa-truck-fast fa-2x text-primary"></i>
              <div>
                <p class="fw-bold mb-1 h-25">Giao hàng nhanh</p>
                <small class="text-muted">Toàn quốc</small>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="p-3 bg-white rounded-3 shadow-sm d-flex gap-3">
              <i class="fas fa-shield-alt fa-2x text-primary"></i>
              <div>
                <p class="fw-bold mb-1">Bảo hành 3 năm</p>
                <small class="text-muted">Chính hãng</small>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div th:replace="layout/footer :: footer"></div>

</body>

</html>
