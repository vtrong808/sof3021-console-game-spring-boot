<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


  <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body>
  <nav th:fragment="header" class="navbar navbar-expand-md navbar-light bg-white shadow-sm sticky-top">
    <div class="container-xl px-4">


      <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-dark" th:href="@{/}">
        <i class="fa-solid fa-gamepad  fs-2"></i>
        Game<span style="color: rgb(10, 237, 71);">Store</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav mx-auto mb-2 mb-md-0 gap-4">
          <li class="nav-item">
            <a class="nav-link fw-semibold active" th:href="@{/}">
              Trang chủ
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold text-muted" th:href="@{/product/list}"> Sản phẩm
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold text-muted" th:href="@{/cart/view}">
              Giỏ hàng
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold text-muted" th:href="@{/order/list}">
              Đơn hàng
            </a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <div class="position-relative" style="width: 280px; max-width: 100%">
            <i
              class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            <input type="search" class="form-control ps-5 rounded-pill border-secondary-subtle"
              placeholder="Tìm kiếm sản phẩm..." />
          </div>

          <a th:href="@{/auth/login}"
            class="btn btn-outline-success rounded-circle d-flex align-items-center justify-content-center user-btn">
            <i class="fa-solid fa-user"></i>
          </a>


          <div class="dropdown">
            <a class="d-flex align-items-center gap-2 text-decoration-none dropdown-toggle" href="#" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">

              <img th:src="@{/images/avatar.png}" class="rounded-circle" width="38" height="38">
              <span class="fw-bold d-none d-md-block"></span>
            </a>

            <ul class="dropdown-menu dropdown-menu-end shadow mt-2">
              <li>
                <a class="dropdown-item" th:href="@{/account/edit-profile}">
                  <i class="fa-regular fa-user me-2"></i> Hồ sơ
                </a>
              </li>
              <li>
                <a class="dropdown-item" th:href="@{/order/my-product-list}">
                  <i class="fa-solid fa-box me-2"></i> Đơn hàng của bạn
                </a>
              </li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li>
                <a class="dropdown-item text-danger" th:href="@{/auth/logout}">
                  <i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất
                </a>
              </li>
            </ul>
          </div>

        </div>
      </div>
    </div>
    </div>
  </nav>
</body>

</html>
