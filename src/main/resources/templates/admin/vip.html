<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Khách Hàng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/admin.css}" rel="stylesheet" />
</head>

<body class="bg-light">
    <div th:replace="layout/sidebar :: sidebar"></div>


    <div class="flex-grow-1" id="page-content-wrapper">

        <nav class="navbar navbar-expand navbar-light bg-white shadow-sm sticky-top px-4">
            <div class="d-flex align-items-center gap-4 w-100">
                <button class="btn btn-link d-lg-none me-3 p-0" id="sidebarToggle">
                    <i class="fas fa-bars fs-4"></i>
                </button>

                <h4 class="fw-bold text-dark mb-0">Quản Lý khách hàng</h4>

                <div class="ms-auto d-flex align-items-center gap-3">
                    <form class="ms-auto" style="max-width:320px">
                        <div class="position-relative">

                            <i
                                class="fas fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                            <input class="form-control rounded-pill bg-light border-0 ps-5" placeholder="Tìm kiếm...">

                        </div>
                    </form>
                    <div class="ms-4 d-flex align-items-center gap-3">
                        <i class="fas fa-bell text-muted"></i>
                        <i class="fas fa-cog text-muted"></i>
                    </div>

                </div>
            </div>
        </nav>
        <div class="p-4 p-lg-5">

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4 mb-5">

                <div class="d-flex gap-3 ms-auto">
                    <button class="btn btn-outline-secondary rounded-pill px-4 py-2 d-flex align-items-center gap-2">
                        <i class="fas fa-download"></i>
                        Xuất dữ liệu
                    </button>

                </div>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-success bg-opacity-10 p-3 rounded">
                                    <i class="fas fa-crown text-success fs-4"></i>
                                </div>
                                <span class="badge bg-success">+0%</span>
                            </div>
                            <p class="text-muted mb-1">Tổng khách VIP</p>
                            <h4 class="fw-bold mb-0">0</h4>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-info bg-opacity-10 p-3 rounded">
                                    <i class="fas fa-hand-holding-dollar text-info fs-4"></i>
                                </div>
                                <span class="badge bg-success">0%</span>
                            </div>
                            <p class="text-muted mb-1">Giá trị trung bình LTV</p>
                            <h4 class="fw-bold mb-0">0</h4>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-warning bg-opacity-10 p-3 rounded">
                                    <i class="fas fa-trophy text-warning fs-4"></i>
                                </div>
                                <span class="badge bg-success">Kỷ lục mới</span>
                            </div>
                            <p class="text-muted mb-1">Khách chi cao nhất</p>
                            <h4 class="fw-bold mb-0">0</h4>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="bg-danger bg-opacity-10 p-3 rounded">
                                    <i class="fas fa-chart-line text-danger fs-4"></i>
                                </div>
                                <span class="badge bg-success">0%</span>
                            </div>
                            <p class="text-muted mb-1">Tỷ lệ giữ chân VIP</p>
                            <h4 class="fw-bold mb-0">0%</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="card-body p-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-4 mb-4">
                        <h5 class="card-title fw-bold mb-0">Danh sách Top VIP</h5>
                        <div class="d-flex gap-2 flex-wrap">
                            <select class="form-select rounded-pill w-auto">
                                <option>30 ngày gần nhất</option>
                                <option>90 ngày gần nhất</option>
                                <option>Tất cả thời gian</option>
                            </select>
                            <button class="btn btn-outline-secondary rounded-pill px-4 py-2">
                                <i class="fas fa-filter me-1"></i> Lọc nâng cao
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Khách hàng</th>
                                    <th>Tổng chi</th>
                                    <th>Lần mua đầu</th>
                                    <th>Lần mua cuối</th>
                                    <th class="text-end">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="table-active">
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <img src="https://via.placeholder.com/50" class="rounded-circle"
                                                alt="Avatar">
                                            <div>
                                                <strong></strong>
                                                <small class="text-muted d-block"></small>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="fw-bold text-success"></td>
                                    <td></td>
                                    <td></td>
                                    <td><span class="badge bg-success rounded-pill px-3 py-2"></span></td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-secondary">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <nav aria-label="Phân trang " class="mt-5">
                        <ul class="pagination pagination-sm justify-content-center">
                            <li class="page-item">
                                <a class="page-link rounded-circle me-2" href="#" aria-label="Trang trước">
                                    <i class="fas fa-chevron-left"></i>
                                </a>
                            </li>
                            <li class="page-item active"><a
                                    class="page-link bg-success border-success text-white rounded-circle mx-1"
                                    href="#">1</a></li>
                            <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">2</a></li>
                            <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">3</a></li>
                            <li class="page-item disabled"><span class="page-link mx-1">...</span></li>
                            <li class="page-item"><a class="page-link rounded-circle mx-1" href="#">12</a></li>
                            <li class="page-item">
                                <a class="page-link rounded-circle ms-2" href="#" aria-label="Trang sau">
                                    <i class="fas fa-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
