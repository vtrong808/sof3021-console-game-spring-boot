<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách yêu thích</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="bg-light">

    <div th:replace="layout/header :: header"></div>

    <main class="container-lg py-5">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4 mb-5">
            <div>
                <h1 class="display-5 fw-bold mb-2 text-dark">Danh sách yêu thích</h1>
                <p class="text-muted fs-5">Quản lý các sản phẩm bạn đã lưu và thêm vào giỏ hàng khi sẵn sàng mua.</p>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-secondary-subtle text-dark px-3 py-2">
                    5 sản phẩm
                </span>
                <button class="btn btn-success rounded-pill px-4 fw-semibold">
                    <i class="fas fa-cart-plus me-2"></i>Thêm tất cả
                </button>
            </div>
        </div>


        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
            <div class="col">
                <div
                    class="card h-100 border-0 shadow-sm product-card rounded-4 overflow-hidden hover-shadow-lg transition-all">
                    <div class="position-relative">
                        <img src="" class="card-img-top object-fit-cover" alt="Sản phẩm yêu thích">
                        <button class="btn btn-sm btn-danger position-absolute top-0 end-0 m-3 rounded-circle shadow">
                            <i class="fas fa-heart"></i>
                        </button>
                    </div>
                    <div class="card-body d-flex flex-column p-4">
                        <h5 class="card-title fw-bold mb-2 text-dark line-clamp-2">PlayStation 5 Pro Edition</h5>
                        <p class="text-success fs-4 fw-bold mb-3">14.990.000₫</p>
                        <div class="mt-auto d-grid gap-2">
                            <button class="btn btn-success rounded-pill">
                                <i class="fas fa-cart-plus me-1"></i> Thêm giỏ
                            </button>
                            <button class="btn btn-outline-danger rounded-pill btn-sm">
                                <i class="fas fa-trash me-1"></i> Xóa
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Thêm các card khác tương tự (lặp bằng th:each) -->
        </div>
    </main>

    <div th:replace="layout/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
