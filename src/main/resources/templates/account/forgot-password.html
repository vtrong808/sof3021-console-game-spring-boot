<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <style>
        .form-floating .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-57%);
            z-index: 5;
            color: #6b7280;
            font-size: 16px;
            pointer-events: none;
        }

        .form-floating>label {
            padding-left: 3rem;

        }

        .form-floating .form-control {
            padding-left: 2.8rem !important;
            padding-right: 3rem !important;
        }

        .form-floating .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25);
        }


        .form-floating i {
            pointer-events: none;
            z-index: 3;
        }

        .btn-primary {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
            transform: translateY(-2px);
        }

        .forgot-title {
            color: #22c55e;
        }

        .rounded-pill {
            border-radius: 50rem !important;
        }

        .shadow-lg {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15) !important;
        }
    </style>
</head>

<body class="bg-light">

    <div th:replace="layout/header :: header"></div>
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 px-3">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-xl-5">

                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                        <div class="text-center py-4">
                            <h2 class="forgot-title fw-bold mb-2 mt-3">Quên mật khẩu</h2>
                            <p class="text-muted mb-0 mt-3">
                                Nhập email để nhận liên kết đặt lại mật khẩu!
                            </p>
                        </div>

                        <div class="card-body p-5">

                            <form method="post">

                                <div class="form-floating position-relative mb-5">
                                    <input type="email" class="form-control rounded-4 ps-5" id="email" name="email"
                                        placeholder="Email" required>

                                    <label for="email">Email của bạn </label>

                                    <i class="fas fa-envelope input-icon"></i>
                                </div>

                                <button type="submit"
                                    class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-lg py-3">
                                    Gửi liên kết khôi phục
                                </button>
                            </form>

                            <div class="text-center mt-5">
                                <a th:href="@{/auth/login}"
                                    class="fw-bold text-decoration-none d-flex align-items-center justify-content-center gap-2"
                                    style="color: #15803d;">
                                    <i class="fas fa-arrow-left"></i>
                                    Quay lại trang đăng nhập
                                </a>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>
    <div th:replace="layout/footer :: footer"></div>

</body>

</html>
