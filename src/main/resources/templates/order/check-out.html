<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Thanh Toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel=" stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <style>
        .hover-border-primary:hover {
            border-color: #0d6efd !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #137fec, #0ea5d6);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0ea5d6, #0891b2);
            transform: translateY(-2px);
        }

        .card.sticky-top {
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>
    <div th:replace="layout/header :: header"></div>

    <main class="container-lg py-5">

        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb bg-transparent p-0 mb-0 fs-5">
                <li class="breadcrumb-item"><a th:href="@{/cart/view}" class="text-muted text-decoration-none">Giỏ
                        hàng</a></li>
                <li class="breadcrumb-item active fw-bold" aria-current="page">Thanh toán & Giao hàng</li>
            </ol>
        </nav>

        <h1 class="h2 fw-bold mb-2">Thanh toán</h1>
        <p class="text-muted mb-5">Hoàn tất thông tin để nhận hàng nhanh chóng</p>

        <div class="row g-5">

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
                    <div class="card-body p-5">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-3">
                                <i class="fas fa-truck-fast text-primary fs-4"></i>
                            </div>
                            <h3 class="h5 fw-bold mb-0">Thông tin giao hàng</h3>
                        </div>

                        <form class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Họ và tên</label>
                                <input type="text" class="form-control form-control-lg rounded-4" placeholder="">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Số điện thoại</label>
                                <input type="tel" class="form-control form-control-lg rounded-4" placeholder="">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold small">Địa chỉ nhận hàng</label>
                                <input type="text" class="form-control form-control-lg rounded-4" placeholder="">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Tỉnh/Thành phố</label>
                                <select class="form-select form-select-lg rounded-4">
                                    <option>Chọn tỉnh/thành</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold small">Ghi chú giao hàng (không bắt buộc)</label>
                                <textarea class="form-control rounded-4" rows="3"
                                    placeholder="Gọi trước khi giao, để trước cửa phòng..."></textarea>
                            </div>
                            <!-- <div class="col-12">
                                <div class="alert alert-info d-flex align-items-center gap-3 mb-0">
                                    <i class="fas fa-school"></i>
                                    <div>Ưu đãi.</div>
                                </div>
                            </div> -->
                        </form>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a th:href="@{/cart/view}"
                        class="btn btn-outline-secondary px-4 py-2 d-flex align-items-center gap-2 text-decoration-none">
                        <i class="fas fa-arrow-left"></i> Quay lại giỏ hàng
                    </a>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-lg rounded-4 ">
                    <div class="card-body p-5">
                        <div class="badge bg-info bg-opacity-10 text-info rounded-pill px-4 py-2 mb-4 fw-bold fs-5">
                            Đơn hàng của bạn
                        </div>

                        <h3 class="h4 fw-bold mb-4">Tóm tắt đơn hàng</h3>

                        <div class="space-y-4 mb-5">
                            <div class="d-flex gap-4">
                                <div class="flex-shrink-0">
                                    <img class="rounded-3 border" width="80" alt="Ảnh">
                                </div>
                                <div class="flex-grow-1">
                                    <h6 class="fw-bold mb-1">Tên sp</h6>
                                    <small class="text-muted">Bản nào</small>
                                    <p class="text-primary fw-bold mb-0 mt-1">Giá</p>
                                </div>
                            </div>

                            <div class="d-flex gap-4">
                                <div class="flex-shrink-0">
                                    <img class="rounded-3 border" width="80" alt="Ảnh">
                                </div>
                                <div class="flex-grow-1">
                                    <h6 class="fw-bold mb-1">Tên sp</h6>
                                    <small class="text-muted">Màu gì</small>
                                    <p class="text-primary fw-bold mb-0 mt-1">Giá</p>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="space-y-3 mb-4">
                            <div class="d-flex justify-content-between">
                                <span class="text-muted">Tạm tính</span>
                                <span class="fw-bold">GIá</span>
                            </div>
                            <div class="d-flex justify-content-between text-success">
                                <span>Giảm giá</span>
                                <span class="fw-bold">Giá</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-muted">Phí vận chuyển</span>
                                <span class="text-success fw-bold">Miễn phí</span>
                            </div>
                        </div>

                        <hr class="my-4 border-dashed">

                        <div class="d-flex justify-content-between align-items-end mb-4">
                            <div>
                                <small class="text-muted d-block">Tổng cộng</small>
                                <h3 class="fw-black mb-0">Giá</h3>
                            </div>
                            <!-- <span class="badge bg-warning text-dark px-3 py-2">Tích điểm</span> -->
                        </div>

                        <button class="btn btn-success btn-lg w-100 py-3 fw-bold rounded-pill shadow-sm">
                            <i class="fas fa-lock me-2"></i> Đặt hàng ngay
                        </button>

                        <div class="text-center mt-4 opacity-75">
                            <i class="fab fa-cc-visa fa-2x me-3"></i>
                            <i class="fab fa-cc-mastercard fa-2x me-3"></i>
                            <i class="fas fa-university fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="layout/footer :: footer"></div>
</body>

</html>
