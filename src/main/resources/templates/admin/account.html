<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Tài Khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link th:href="@{/css/admin.css}" rel="stylesheet" />
</head>

<body class="bg-light">
    <div th:replace="layout/sidebar :: sidebar"></div>

    <div class="flex-grow-1" id="page-content-wrapper">

        <nav class="navbar navbar-expand navbar-light bg-white shadow-sm sticky-top px-4">
            <div class="d-flex align-items-center gap-4 w-100">
                <h4 class="fw-bold text-dark mb-0">Quản lý tài khoản</h4>
            </div>
        </nav>

        <div class="p-4 p-lg-5">

            <div class="row g-4 mb-5">
                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body p-4">
                            <p class="text-muted mb-1">Tổng tài khoản</p>
                            <h4 class="fw-bold mb-0" id="totalUsers">0</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-5">
                <div class="card-body p-5">
                    <h5 class="card-title fw-bold mb-4" id="formTitle">Tạo tài khoản mới</h5>

                    <form id="userForm" class="row g-4" onsubmit="saveUser(event)">
                        <input type="hidden" id="userId">

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tên đăng nhập</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light border-0"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" id="username" class="form-control border-0 bg-light rounded-end-4" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light border-0"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" id="email" class="form-control border-0 bg-light rounded-end-4" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mật khẩu</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="password" class="form-control border-0 bg-light" placeholder="Nhập để đổi mật khẩu">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" id="fullname" class="form-control form-control-lg bg-light border-0 rounded-4">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Vai trò</label>
                            <select id="role" class="form-select form-select-lg bg-light border-0 rounded-4">
                                <option value="CUSTOMER">Khách hàng</option>
                                <option value="ADMIN">Admin – Quản trị viên</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold d-block">Trạng thái</label>
                            <div class="d-flex gap-4 mt-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="status" id="statusActive" value="true" checked>
                                    <label class="form-check-label text-success" for="statusActive">Hoạt động</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="status" id="statusLocked" value="false">
                                    <label class="form-check-label text-danger" for="statusLocked">Bị chặn</label>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 text-end">
                            <button type="button" onclick="resetForm()" class="btn btn-outline-danger btn-lg px-4 me-3">Hủy / Mới</button>
                            <button type="submit" class="btn btn-success btn-lg px-4 fw-bold">Lưu tài khoản</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="card-body p-4">
                    <h5 class="card-title fw-bold mb-4">Danh sách tài khoản</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Tên đăng nhập</th>
                                    <th>Họ tên & Email</th>
                                    <th>Vai trò</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_USER = '/api/admin/users';

        document.addEventListener("DOMContentLoaded", () => {
            loadUsers();
        });

        // 1. Load danh sách User
        async function loadUsers() {
            try {
                const res = await fetch(API_USER);
                if (!res.ok) throw new Error("Lỗi gọi API");
                const users = await res.json();
                
                document.getElementById('totalUsers').innerText = users.length;
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';

                users.forEach(u => {
                    const row = `
                        <tr>
                            <td>#${u.userId}</td>
                            <td class="fw-bold text-primary">${u.username}</td>
                            <td>
                                <div class="fw-bold">${u.fullName || '---'}</div>
                                <small class="text-muted">${u.email}</small>
                            </td>
                            <td>
                                <span class="badge ${u.role === 'ADMIN' ? 'bg-primary' : 'bg-secondary'} rounded-pill px-3">
                                    ${u.role}
                                </span>
                            </td>
                            <td>
                                <span class="badge ${u.isActive ? 'bg-success' : 'bg-danger'} rounded-pill px-3">
                                    ${u.isActive ? 'Hoạt động' : 'Bị chặn'}
                                </span>
                            </td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-primary me-2" onclick="editUser(${u.userId})"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.userId})"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) { console.error(err); }
        }

        // 2. Lưu User (Tạo mới / Cập nhật)
        async function saveUser(e) {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_USER}/${id}` : API_USER;

            const userData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                fullName: document.getElementById('fullname').value,
                role: document.getElementById('role').value,
                isActive: document.getElementById('statusActive').checked
            };

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (res.ok) {
                    alert('Lưu thành công!');
                    resetForm();
                    loadUsers();
                } else {
                    alert('Lỗi! Có thể username hoặc email đã tồn tại.');
                }
            } catch (err) { console.error(err); }
        }

        // 3. Đổ dữ liệu lên form để sửa
        async function editUser(id) {
            try {
                const res = await fetch(`${API_USER}/${id}`);
                const u = await res.json();

                document.getElementById('userId').value = u.userId;
                document.getElementById('username').value = u.username;
                document.getElementById('email').value = u.email;
                document.getElementById('fullname').value = u.fullName;
                document.getElementById('role').value = u.role;
                
                if(u.isActive) document.getElementById('statusActive').checked = true;
                else document.getElementById('statusLocked').checked = true;

                document.getElementById('password').value = ''; 
                document.getElementById('formTitle').innerText = "Cập nhật tài khoản: " + u.username;
                window.scrollTo(0, 0);

            } catch (err) { console.error(err); }
        }

        // 4. Xóa User
        async function deleteUser(id) {
            if(!confirm('Bạn có chắc muốn xóa vĩnh viễn user này?')) return;
            try {
                const res = await fetch(`${API_USER}/${id}`, { method: 'DELETE' });
                if(res.ok) loadUsers();
                else alert('Không thể xóa!');
            } catch(err) { console.error(err); }
        }

        // 5. Reset form
        function resetForm() {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('statusActive').checked = true;
            document.getElementById('formTitle').innerText = "Tạo tài khoản mới";
        }
    </script>
</body>
</html>
